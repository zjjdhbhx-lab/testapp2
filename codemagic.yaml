workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign
      - mkdir -p Payload
      - cp -R build/ios/iphoneos/Runner.app Payload/
      - zip -r testapp2.ipa Payload/
    artifacts:
      - testapp2.ipa
    publishing:
      email:
        recipients:
          - zjjdhbhx@gmail.com
